sonar.organization=mathieusueur
sonar.projectKey=MathieuSUEUR_Bomberbman
sonar.projectName=Bomberbman
sonar.host.url=https://sonarcloud.io

# Chemins des sources et des tests
sonar.sources=server/src,client/src,shared/src
sonar.tests=server/test,client/test

# Encodage
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-electron/**,**/coverage/**,client/release/**,**/*.html,**/*.css,**/*.svg,**/*.png

# Exclure les tests des vérifications de duplication de code (CPD)
sonar.cpd.exclusions=server/test/**,client/test/**

# Rapports de couverture de code (générés par Vitest au format LCOV)
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info

